name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version du manifeste
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          jq --arg v "$VERSION" --arg d "$URL" '.version=$v | .download=$d' module.json > tmp.json && mv tmp.json module.json
      - name: Archive
        run: zip -r module.zip module.json scripts styles lang fonts README.md LICENSE
      - name: Joindre à la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
